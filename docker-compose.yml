services:
  website:
    build: .
    environment:
      - PORT=${CONTAINER_PORT:-3000}
      - TRUST_PROXY=${TRUST_PROXY:-false}
      - CAPTCHA_SECRET=${CAPTCHA_SECRET:-}
    ports:
      - "${HOST_PORT:-8080}:${CONTAINER_PORT:-3000}"
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
